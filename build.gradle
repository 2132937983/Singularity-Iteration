plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Compile the reusable framework without the content implementation or optional mod APIs.
sourceSets {
    core {
        java.srcDir 'src/main/java'
        java.include 'com/miophas/singularity_iteration/core/**'
    }
    main {
        java.exclude 'com/miophas/singularity_iteration/core/**'
    }
    addonExample { }
    // Test-only GuideME stand-in so MI/AE2 boot on the headless compat GameTest server.
    guidemeStub { }
    // Test-only stand-in for Botania's public mana API (compat server run only).
    botaniaStub { }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
    exclude("**/*.bat") // Windows batch files (CurseForge compliance)
    exclude("**/*.exe") // Windows executables (CurseForge compliance)
    exclude("**/*.sh") // Shell scripts (CurseForge compliance)
    exclude("**/*.dll") // Windows libraries (CurseForge compliance)
    exclude("**/*.so") // Linux libraries (CurseForge compliance)
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    maven {
        name = 'localCoreDevelopment'
        url = uri('repo')
        content { includeModule 'com.miophas.singularity_iteration', 'singularity-iteration-core' }
    }
    mavenCentral()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Shedaniel's maven"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Architectury maven"
        url = "https://maven.architectury.dev/"
    }

    maven {
        url "https://modmaven.dev/"
        content {
            includeGroup "dev.technici4n"
        }
    }

    // EMI Maven
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup "dev.emi"
        }
    }

    // REI Maven
    repositories {
        maven { url "https://maven.shedaniel.me" }
    }

    // Curios Maven
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    addModdingDependenciesTo sourceSets.core
    addModdingDependenciesTo sourceSets.addonExample
    addModdingDependenciesTo sourceSets.guidemeStub
    addModdingDependenciesTo sourceSets.botaniaStub

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // 添加 JVM 内存参数，避免内存不足崩溃
            jvmArguments.addAll '-Xmx6G', '-Xms4G'
            
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.WARN
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.core)
        }
        si_core_example {
            sourceSet(sourceSets.addonExample)
        }
    }
}

// Keep the example out of normal client/server runs and production artifacts.
neoForge.runs.configureEach { loadedMods = [neoForge.mods[mod_id]] }
neoForge.runs.register('addonGameTestServer') {
    type = 'gameTestServer'
    loadedMods = [neoForge.mods[mod_id], neoForge.mods.si_core_example]
    gameDirectory = file('build/addon-gametest')
    systemProperty 'neoforge.enabledGameTestNamespaces', 'si_core_example'
    logLevel = org.slf4j.event.Level.INFO
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation sourceSets.core.output
    coreCompileOnly "org.jspecify:jspecify:1.0.0"
    // JEI API (compile-time only)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    
    // JEI full mod (runtime only, optional)
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // 添加 jspecify
    compileOnly "org.jspecify:jspecify:1.0.0"

    // Jade
    compileOnly "curse.maven:jade-324717:${jade_id}"

    // GregTech - Optional dependency for compatibility
    compileOnly "curse.maven:gregtechceu-modern-890405:6766269"

    // Applied Energistics 2 API - Optional dependency for compatibility
    compileOnly "curse.maven:applied-energistics-2-223794:7027323"

    // EMI API (compile-time only, optional dependency)
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    // EMI full mod (runtime only, optional)
    // localRuntime "dev.emi:emi-neoforge:${emi_version}"

    // Architectury API (required for REI)
    compileOnly "dev.architectury:architectury-neoforge:13.0.8"
    // localRuntime "dev.architectury:architectury-neoforge:13.0.8"

    // REI (Roughly Enough Items) - Optional dependency for compatibility
    compileOnly "curse.maven:roughly-enough-items-310111:6199140"
    // localRuntime "curse.maven:roughly-enough-items-310111:6199140"

    // Curios API (compile-time only, optional dependency)
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"

}

tasks.named('jar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // development-only screenshot director (inert without -Dsi.capture) is not shipped
    exclude "com/miophas/singularity_iteration/common/client/dev/**"
    from sourceSets.core.output
}

def coreJar = tasks.register('coreJar', Jar) {
    archiveBaseName = 'singularity-iteration-core'
    from sourceSets.core.output
}

def coreSourcesJar = tasks.register('coreSourcesJar', Jar) {
    archiveBaseName = 'singularity-iteration-core'
    archiveClassifier = 'sources'
    from sourceSets.core.allSource
}

// Deliberately consume the JAR, not sourceSets.main/core.output. No common or optional APIs.
dependencies {
    if (providers.gradleProperty('coreExampleFromRepository').isPresent()) {
        addonExampleCompileOnly "${project.group}:singularity-iteration-core:${project.version}"
    } else {
        addonExampleCompileOnly files(coreJar)
    }
}

tasks.named('compileAddonExampleJava') {
    // This mode verifies the published Maven dependency even if its bytes match the local JAR.
    if (providers.gradleProperty('coreExampleFromRepository').isPresent()) outputs.upToDateWhen { false }
    doFirst {
        def workspaceOutputs = sourceSets.main.output.files + sourceSets.core.output.files
        if (classpath.files.any { workspaceOutputs.contains(it) })
            throw new GradleException('Addon example must consume the core JAR, not workspace class directories')
    }
}

tasks.register('addonExampleJar', Jar) {
    archiveBaseName = 'singularity-iteration-core-example'
    from sourceSets.addonExample.output
}

tasks.register('checkCoreArchitecture') {
    group = 'verification'
    description = 'Reject content, client and optional-mod dependencies in core.'
    inputs.files(sourceSets.core.allJava, sourceSets.addonExample.allJava)
    doLast {
        def forbidden = [
            'com.miophas.singularity_iteration.common.', 'com.singularity_iteration.mio_icif',
            'net.minecraft.client.', 'net.neoforged.neoforge.client.', 'com.mojang.blaze3d.',
            'mezz.jei.', 'dev.emi.', 'me.shedaniel.', 'top.theillusivec4.',
            'aztech.modern_industrialization.', 'com.gregtechceu.', 'appeng.', 'mekanism.'
        ]
        sourceSets.core.allJava.each { source ->
            def code = source.getText('UTF-8')
            forbidden.each { name ->
                if (code.contains(name)) throw new GradleException("Forbidden core reference ${name}: ${source}")
            }
        }
        sourceSets.addonExample.allJava.each { source ->
            def code = source.getText('UTF-8')
            if (code.contains('com.miophas.singularity_iteration.common.'))
                throw new GradleException("Example depends on common: ${source}")
            // Engine regression tests may inspect internals; actual addon examples and
            // consumer contract tests must demonstrate supported public entry points.
            if (!source.name.endsWith('GameTests.java') || source.name == 'PublicApiGameTests.java') {
                if (code.contains('com.miophas.singularity_iteration.core.runtime.') ||
                        code =~ /\b(getEnergyStorageInternal|internalStorage|internalLedger|getEnergyStorageCapability)\s*\(/)
                    throw new GradleException("Public addon example uses an internal bridge: ${source}")
            }
        }
    }
}

tasks.named('check') { dependsOn 'checkCoreArchitecture', 'compileAddonExampleJava' }

tasks.register('checkCoreDistribution') {
    group = 'verification'
    dependsOn tasks.named('jar'), coreJar
    inputs.files(tasks.named('jar').flatMap { it.archiveFile }, coreJar.flatMap { it.archiveFile })
    doLast {
        def corePrefix = 'com/miophas/singularity_iteration/core/'
        new java.util.zip.ZipFile(coreJar.get().archiveFile.get().asFile).withCloseable { development ->
            new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { full ->
                def entries = java.util.Collections.list(full.entries())*.name
                if (entries.size() != entries.toSet().size()) throw new GradleException('Duplicate production JAR entries')
                if (entries.any { it.startsWith('com/singularity_iteration/mio_icif/') || it.startsWith('example/sicore/') })
                    throw new GradleException('Production JAR contains old packages or example classes')
                def developmentClasses = java.util.Collections.list(development.entries()).findAll { it.name.endsWith('.class') }
                if (developmentClasses.isEmpty()) throw new GradleException('Empty core JAR')
                developmentClasses.each { entry ->
                    if (!entry.name.startsWith(corePrefix)) throw new GradleException("Non-core class in development JAR: ${entry.name}")
                    def bundled = full.getEntry(entry.name)
                    if (bundled == null || !java.util.Arrays.equals(development.getInputStream(entry).bytes, full.getInputStream(bundled).bytes))
                        throw new GradleException("Core class differs in production JAR: ${entry.name}")
                }
                if (entries.count { it.startsWith(corePrefix) && it.endsWith('.class') } != developmentClasses.size())
                    throw new GradleException('Stale core classes in production JAR')
                ['mio_icif.mixins.json', 'scex-independent-platform.mixins.json'].each { name ->
                    def config = new groovy.json.JsonSlurper().parse(full.getInputStream(full.getEntry(name)))
                    ((config.mixins ?: []) + (config.client ?: []) + (config.server ?: [])).each { mixin ->
                        def target = (config.package + '.' + mixin).replace('.', '/') + '.class'
                        if (full.getEntry(target) == null) throw new GradleException("Missing mixin class ${target}")
                    }
                }
            }
        }
    }
}
tasks.named('check') { dependsOn 'checkCoreDistribution' }

// Optional extra architecture rules. The file is not committed upstream, so a clean
// clone must still build; the core architecture check itself is defined above.
if (file('gradle/core-architecture.gradle').exists()) {
    apply from: 'gradle/core-architecture.gradle'
}

tasks.named('assemble') { dependsOn coreJar, coreSourcesJar }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
        register('core', MavenPublication) {
            artifactId = 'singularity-iteration-core'
            artifact coreJar
            artifact coreSourcesJar
            pom {
                name = 'Singularity Iteration Core'
                description = 'Compile-only framework for addons; runtime is supplied by the mio_icif mod.'
            }
        }
    }
    repositories {
        maven {
            url = uri('repo')
        }
        // Opt-in release destination. Credentials are supplied by Gradle properties,
        // never embedded in the repository; local verification still uses repo/.
        if (providers.gradleProperty('coreReleaseRepositoryUrl').isPresent()) {
            maven {
                name = 'coreRelease'
                url = uri(providers.gradleProperty('coreReleaseRepositoryUrl').get())
                credentials(PasswordCredentials)
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-this-escape', '-encoding', 'UTF-8']
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ------------------------------------------------------------------ compat GameTests
// Boots the real GregTech Modern, Modern Industrialization and AE2 jars next to SI and
// runs the same si_core_example GameTests plus the cross-mod energy/storage tests,
// which register themselves only when the foreign mod is present. Nothing here ships.
configurations { compatMods { transitive = false }; compatClientMods { transitive = false } }
dependencies {
    // GTM 7.0.1 cannot boot on a dedicated-server dist (it loads ClientLevel); it is exercised by the client compat run
    compatClientMods "curse.maven:gregtechceu-modern-890405:6766269"
    compatMods "curse.maven:modern-industrialization-405388:7796816"
    compatMods "curse.maven:applied-energistics-2-223794:7027323"
}
def guidemeStubJar = tasks.register('guidemeStubJar', Jar) {
    archiveBaseName = 'guideme-test-stub'
    from sourceSets.guidemeStub.output
}
def botaniaStubJar = tasks.register('botaniaStubJar', Jar) {
    archiveBaseName = 'botania-api-test-stub'
    from sourceSets.botaniaStub.output
}
def compatModsDir = file('build/compat-gametest/mods')
def syncCompatMods = tasks.register('syncCompatMods', Sync) {
    from configurations.compatMods
    from guidemeStubJar
    from botaniaStubJar
    into compatModsDir
}
neoForge.runs.register('compatGameTestServer') {
    type = 'gameTestServer'
    loadedMods = [neoForge.mods[mod_id], neoForge.mods.si_core_example]
    gameDirectory = file('build/compat-gametest')
    systemProperty 'neoforge.enabledGameTestNamespaces', 'si_core_example'
    logLevel = org.slf4j.event.Level.INFO
}
tasks.matching { it.name == 'prepareCompatGameTestServerRun' }.configureEach { dependsOn syncCompatMods }

// GregTech Modern only boots on the client dist in a dev workspace, so its compat tests run
// in a headless client: CompatTestDirector (dev-only) creates a world and runs /test runall.
def compatClientDir = file('build/compat-client')
def syncCompatClientMods = tasks.register('syncCompatClientMods', Sync) {
    from configurations.compatClientMods
    into new File(compatClientDir, 'mods')
    doLast {
        def options = new File(compatClientDir, 'options.txt')
        if (!options.exists()) options.text = 'onboardAccessibility:false\nmenuBackgroundBlurriness:0\nrenderDistance:4\nsimulationDistance:5\ngraphicsMode:0\nsoundCategory_master:0.0\n'
    }
}
neoForge.runs.register('compatClient') {
    client()
    loadedMods = [neoForge.mods[mod_id], neoForge.mods.si_core_example]
    gameDirectory = compatClientDir
    systemProperty 'neoforge.enabledGameTestNamespaces', 'si_core_example'
    systemProperty 'si.compattest', new File(compatClientDir, 'result.txt').absolutePath
    // Only the GregTech tests: everything else already ran on the compat server.
    systemProperty 'si.compattests', ['sicablefeedsgtmachine', 'sistoragefeedsadjacentgtmachine', 'sineverovervoltsgtmachine', 'gtnetworkfeedssistorage']
        .collect { 'compatenergygametests.' + it }.join(',')
    logLevel = org.slf4j.event.Level.INFO
}
tasks.matching { it.name == 'prepareCompatClientRun' }.configureEach { dependsOn syncCompatClientMods }
