pluginManagement {
  repositories { mavenCentral(); maven { url = uri("https://maven.neoforged.net/releases") }; gradlePluginPortal() }
  resolutionStrategy { eachPlugin { if (requested.id.id == 'net.neoforged.moddev') useModule("net.neoforged:moddev-gradle:${requested.version}") } }
}
rootProject.name = 'Singularity-Iteration'
