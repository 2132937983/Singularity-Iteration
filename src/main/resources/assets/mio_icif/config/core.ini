; Singularity Iteration Core Config
; Controls core energy net behavior and other engine-level settings.
; Changes require a restart unless noted otherwise.

[energynet]
; Enable voltage overload effects: cable meltdown, insulation stripping,
; electric shock damage, and machine explosion when receiving above-tier packets.
; Set to false to disable all overload damage while keeping energy transfer working.
enableVoltageOverload = true

; Enable machine explosion when a sink receives a packet exceeding its tier.
; Requires enableVoltageOverload = true to take effect.
enableEnetExplosions = true

; Enable cable meltdown and insulation stripping when a packet exceeds
; the conductor's breakdown or insulation breakdown energy.
; Requires enableVoltageOverload = true to take effect.
enableEnetCableMeltdown = true

; Enable electric shock damage to nearby entities when a packet exceeds
; the insulation energy absorption threshold.
; Requires enableVoltageOverload = true to take effect.
enableEnetShockDamage = true

; IC2 default: floor each complete path's loss to whole EU. False retains fractional EU.
; This value applies only to distributionMode = legacy.
; Launch override: -Dscex.independent.roundEnetLoss=false
roundEnetLoss = true

; Native EU distribution (0.1.8.0).
;   fair   = deterministic fair-share distribution (smart grid). Loads and
;            transformers get energy before storage. Each receiver in one stage
;            gets the same fraction of its demand. No random order. Default.
;   legacy = the IC2-style packet priority walk of 0.1.7.x.
; The common config value energyNet.distributionMode overrides this value.
; Launch override: -Dscex.independent.distribution=legacy
distributionMode = fair

; Line loss of the fair distribution.
;   lossless     = no cable loss. Default.
;   proportional = loss = energy * cableLoss / packetVoltage. A higher voltage
;                  has a lower loss fraction.
; The common config value energyNet.lineLossModel overrides this value.
; Launch override: -Dscex.independent.lineLoss=proportional
lineLossModel = lossless

[debug]
; Log energy net API accesses that aren't read-only.
logEnetApiAccesses = false
; Log grid update issues.
logGridUpdateIssues = true

[wind]
; Global wind multiplier applied to the simulated wind field before it reaches
; wind kinetic generators and anemometers. Higher values raise the typical wind
; strength (MCU) at every height; weather bonuses scale with it as well.
; Default 4.0 gives roughly 45-110 MCU on a clear day at mid-to-high altitude.
globalMultiplier = 3.14
