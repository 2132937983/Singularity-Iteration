allprojects { project ->
    afterEvaluate {
        ['Probe','Build','Reload'].each { phase ->
            project.neoForge.runs.register('biogasSteamTower'+phase) {
                type = 'server'
                loadedMods = [project.neoForge.mods[project.mod_id], project.neoForge.mods.si_core_example]
                gameDirectory = project.file(phase == 'Probe' ? 'build/biogas-steam-tower/probe-game' : 'build/biogas-steam-tower/game')
                systemProperty 'si.biogas2.'+phase.toLowerCase(), 'true'
                programArgument '--nogui'
                logLevel = org.slf4j.event.Level.INFO
            }
        }
    }
}
