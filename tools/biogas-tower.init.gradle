allprojects { project ->
    afterEvaluate {
        ['Build','Reload'].each { phase ->
            project.neoForge.runs.register('biogasTower' + phase) {
                type = 'server'
                loadedMods = [project.neoForge.mods[project.mod_id], project.neoForge.mods.si_core_example]
                gameDirectory = project.file('build/biogas-tower/game')
                systemProperty 'si.biogas.' + phase.toLowerCase(), 'true'
                programArgument '--nogui'
                logLevel = org.slf4j.event.Level.INFO
            }
        }
    }
}
