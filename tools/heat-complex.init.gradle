allprojects { project ->
    afterEvaluate {
        project.neoForge.runs.register('heatComplexAudit') {
            type = 'gameTestServer'
            loadedMods = [project.neoForge.mods[project.mod_id], project.neoForge.mods.si_core_example]
            gameDirectory = project.file('build/heat-complex/audit-game')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'si_heat_complex'
            logLevel = org.slf4j.event.Level.INFO
        }
        project.neoForge.runs.register('heatComplexConstruction') {
            type = 'server'
            loadedMods = [project.neoForge.mods[project.mod_id], project.neoForge.mods.si_core_example]
            gameDirectory = project.file('build/heat-complex/construction-game')
            systemProperty 'si.heatcomplex.build', 'true'
            programArgument '--nogui'
            logLevel = org.slf4j.event.Level.INFO
        }
        project.neoForge.runs.register('heatComplexReload') {
            type = 'server'
            loadedMods = [project.neoForge.mods[project.mod_id], project.neoForge.mods.si_core_example]
            gameDirectory = project.file('build/heat-complex/construction-game')
            systemProperty 'si.heatcomplex.verify', 'true'
            programArgument '--nogui'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}
