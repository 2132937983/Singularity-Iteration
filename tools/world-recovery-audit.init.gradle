// Load an exact disposable copy with the development client's local mods/configs.
allprojects { project ->
    afterEvaluate {
        project.neoForge.runs.register('worldRecoveryAudit') {
            type = 'server'
            loadedMods = [project.neoForge.mods[project.mod_id], project.neoForge.mods.si_core_example]
            gameDirectory = project.file('build/heat-complex/world-recovery-audit')
            systemProperty 'si.worldrecovery.audit', 'true'
            programArgument '--nogui'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}
